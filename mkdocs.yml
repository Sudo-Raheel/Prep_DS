site_name: Prep DS
site_description: Data Science interview prep notes
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
nav:
  - Home: index.md
  - Cheat sheet: cheatsheet.md
  - Classification:
      - Logistic & multiclass: classification/logit-multiclass.md
      - AUC & ROC: classification/auc.md
      - Q&A: classification/qa.md
  - Statistical inference:
      - p-values and tests:
          - Overview: statistical-inference/p-value/index.md
          - t-distribution: statistical-inference/p-value/t-distribution.md
          - One-sample t-test: statistical-inference/p-value/one-sample-t.md
          - Two-sample t-test: statistical-inference/p-value/two-sample-t.md
          - Paired t-test: statistical-inference/p-value/paired-t.md
          - z-test: statistical-inference/p-value/z-test.md
          - Wilcoxon signed-rank: statistical-inference/p-value/wilcoxon.md
          - Chi-square independence: statistical-inference/p-value/chi-square.md
          - One-way ANOVA: statistical-inference/p-value/anova.md
      - Q&A: statistical-inference/qa.md
  - Probability:
      - First-step expectation: probability/expectation-first-step.md
      - MLE and MAP: probability/mle-map.md
  - Model evaluation:
      - Overview: model-evaluation/index.md
      - Data drift: model-evaluation/drift.md
  - Optimization: optimization.md
  - SQL roadmap: sql/roadmap.md
  - System design roadmap: system-design/roadmap.md
  - Puzzles: puzzles/fermi.md
  - General Q&A: general-qa/interview-questions.md
markdown_extensions:
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.superfences
  - pymdownx.tasklist: {custom_checkbox: true}
  - tables
  - toc: {permalink: true}
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js
